<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Калькулятор калорий</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <h1>Калькулятор калорий</h1>
      <p class="subtitle">
        Узнайте суточную норму калорий по формуле Миффлина-Сан Жеора
      </p>

      <form id="calculator" class="calculator" novalidate>
        <fieldset class="field field--gender">
          <legend>Пол</legend>
          <div class="gender-toggle">
            <label>
              <input type="radio" name="gender" value="female" checked />
              Женский
            </label>
            <label>
              <input type="radio" name="gender" value="male" />
              Мужской
            </label>
          </div>
        </fieldset>

        <div class="field-grid">
          <label class="field">
            Возраст, лет
            <input
              type="number"
              name="age"
              min="1"
              max="120"
              inputmode="numeric"
              placeholder="30"
              required
            />
          </label>

          <label class="field">
            Рост, см
            <input
              type="number"
              name="height"
              min="1"
              max="250"
              inputmode="numeric"
              placeholder="170"
              required
            />
          </label>

          <label class="field">
            Вес, кг
            <input
              type="number"
              name="weight"
              min="1"
              max="400"
              step="0.1"
              inputmode="decimal"
              placeholder="65"
              required
            />
          </label>
        </div>

        <label class="field">
          Уровень активности
          <select name="activity">
            <option value="1.2">Минимальная — сидячая работа, без тренировок</option>
            <option value="1.375">Лёгкая — тренировки 1–3 раза в неделю</option>
            <option value="1.55">Средняя — тренировки 3–5 раз в неделю</option>
            <option value="1.725">Высокая — тренировки 6–7 раз в неделю</option>
            <option value="1.9">Очень высокая — тяжёлые тренировки и физическая работа</option>
          </select>
        </label>

        <p id="error" class="error" hidden></p>

        <div class="actions">
          <button type="submit" class="btn btn--primary">Рассчитать</button>
          <button type="reset" class="btn" id="reset-btn">Сбросить</button>
        </div>
      </form>

      <section id="results" class="results" hidden>
        <div class="result-card result-card--main">
          <span class="result-label">Базовый обмен веществ (BMR)</span>
          <span class="result-value" id="result-bmr">0 ккал</span>
        </div>
        <div class="result-card result-card--main">
          <span class="result-label">Норма для поддержания веса</span>
          <span class="result-value" id="result-maintenance">0 ккал</span>
        </div>
        <div class="result-card result-card--main">
          <span class="result-label">Индекс массы тела (ИМТ)</span>
          <span class="result-value" id="result-bmi">0</span>
          <span class="result-hint" id="result-bmi-category">Норма</span>
        </div>

        <div class="result-grid">
          <div class="result-card">
            <span class="result-label">Плавное похудение</span>
            <span class="result-value" id="result-mild-loss">0 ккал</span>
          </div>
          <div class="result-card">
            <span class="result-label">Похудение</span>
            <span class="result-value" id="result-loss">0 ккал</span>
          </div>
          <div class="result-card">
            <span class="result-label">Плавный набор массы</span>
            <span class="result-value" id="result-mild-gain">0 ккал</span>
          </div>
          <div class="result-card">
            <span class="result-label">Набор массы</span>
            <span class="result-value" id="result-gain">0 ккал</span>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
